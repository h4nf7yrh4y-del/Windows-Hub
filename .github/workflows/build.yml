name: Build Windows

# The app is Windows-only, so the installer is built on a real Windows runner.
# That also means the PowerShell scripts get validated by the exact shell the
# app calls at runtime, which no Linux machine can do.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # The Electron binary is only needed to run the app, not to test it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: node test/gpu.test.js

  build-windows:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        # On Windows this also runs every generated PowerShell script through
        # Windows PowerShell itself, which is what the app actually invokes.
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist
        env:
          # No code-signing certificate is available; stop electron-builder
          # from searching for one and failing the build over it.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WindowsHub-setup
          path: release/*setup*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WindowsHub-portable
          path: release/*portable*.exe
          if-no-files-found: error
          retention-days: 90

      - name: Attach binaries to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          generate_release_notes: true
