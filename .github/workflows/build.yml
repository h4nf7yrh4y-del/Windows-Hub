name: Build Windows

# The app is Windows-only, so the installer is built on a real Windows runner.
# That also means the PowerShell scripts get validated by the exact shell the
# app calls at runtime, which no Linux machine can do.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Fertige Dateien veröffentlichen, auch ohne neue Versionsnummer'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron needs a handful of desktop libraries and a display even when
      # nothing is ever shown. The runner image carries most of them; the
      # sound library was renamed between Ubuntu releases, hence the fallback.
      - name: Install system libraries for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libnss3 libatk-bridge2.0-0 libgtk-3-0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Starts the real application under a virtual display and drives every
      # view. Windows-only calls fail here by design; the point is that the
      # user interface survives those failures instead of going blank.
      - name: Renderer smoke tests
        run: npm run test:ui

  build-windows:
    name: Build installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits, so the publish step can see whether the version moved.
          # The default is one, and the comparison would then have nothing to
          # compare against.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        # On Windows this also runs every generated PowerShell script through
        # Windows PowerShell itself, which is what the app actually invokes.
        run: npm test

      # The only place the application is ever started on the platform it was
      # written for. Every Windows-only path — the process list, the display
      # enumeration, the feature catalogue — runs for real here.
      - name: Renderer smoke tests
        run: npm run test:ui

      - name: Build installer and portable exe
        run: npm run dist
        env:
          # No code-signing certificate is available; stop electron-builder
          # from searching for one and failing the build over it.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List build output
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      # There were two upload-artifact steps here and they are gone on purpose.
      # They stored the same two files the release below publishes, zipped,
      # reachable only while signed in, and kept for ninety days -- a little
      # over two hundred megabytes per push. That filled the artifact quota,
      # and because the upload runs before the release, a full quota stopped
      # the release from being published at all. The duplicate was costing the
      # thing it duplicated.

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      # Uploading the two executables takes a quarter of an hour, and it ran on
      # every push -- including the ones that only changed a comment. A release
      # is worth that when there is a new version to release, and not otherwise.
      #
      # Published when the version in package.json moved, when the push is a
      # tag, or when someone asked for it from the Actions page. Anything else
      # builds and tests as before and says why it stopped short, because an
      # exe that quietly stays old is worse than one that is not there.
      - name: Decide whether to publish
        id: decide
        shell: pwsh
        run: |
          $reason = ''
          $publish = $false

          if ('${{ github.event_name }}' -eq 'pull_request') {
            $reason = 'Pull Request veröffentlicht nie.'
          } elseif ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $publish = $true
            $reason = 'Push auf einen Versions-Tag.'
          } elseif ('${{ inputs.release }}' -eq 'true') {
            $publish = $true
            $reason = 'Von Hand angefordert.'
          } else {
            $previous = $null
            try { $previous = (git show HEAD~1:package.json | ConvertFrom-Json).version } catch { }
            if (-not $previous) {
              # No previous commit to compare against: publishing is the safer
              # guess, since the alternative is silently shipping nothing.
              $publish = $true
              $reason = 'Vorherige Version nicht lesbar, im Zweifel veroeffentlichen.'
            } elseif ($previous -ne '${{ steps.pkg.outputs.version }}') {
              $publish = $true
              $reason = "Version von $previous auf ${{ steps.pkg.outputs.version }} gehoben."
            } else {
              $reason = "Version unveraendert bei ${{ steps.pkg.outputs.version }}."
            }
          }

          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          $headline = if ($publish) { 'Wird veroeffentlicht' } else { 'Wird nicht veroeffentlicht' }
          Write-Output "$headline - $reason"
          "## $headline`n`n$reason" >> $env:GITHUB_STEP_SUMMARY
          if (-not $publish) {
            "`nDie fertigen Dateien liegen im Lauf, aber nicht als Release. Fuer eine neue Release: Version in package.json erhoehen, oder den Workflow von Hand mit ,Release' starten." >> $env:GITHUB_STEP_SUMMARY
          }

      # Artifacts are only reachable while signed in and always arrive zipped.
      # A release gives a plain .exe link that anyone can download directly.
      #
      # Published twice on purpose. The release keeps one tag, so every build
      # replaces the two executables under names that already exist, and the
      # action deletes and re-uploads them at the same time. That races: the
      # run before this one had both hundred-megabyte uploads fail within a
      # second of starting, while latest.yml and the blockmap -- the two files
      # that were new and needed no delete -- went up fine. The first attempt
      # is allowed to fail and the second is not, so a genuine problem still
      # turns the run red.
      - name: Publish release
        id: publish
        if: steps.decide.outputs.publish == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: Windows Hub ${{ steps.pkg.outputs.version }}
          # Anything not built from a tag is a build of the working branch.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          # latest.yml belongs here too: it is the file the hub's own updater
          # reads to find out that a newer version exists. Without it the
          # release looks complete and every update check answers with a 404.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          body: |
            Fertige Windows-Dateien, gebaut auf einem Windows-Runner aus
            `${{ github.sha }}`.

            **WindowsHub-${{ steps.pkg.outputs.version }}-portable.exe**
            Startet direkt, ohne Installation. Nimm diese, wenn du es nur
            ausprobieren willst.

            **WindowsHub-${{ steps.pkg.outputs.version }}-setup.exe**
            Installer mit Startmenü- und Desktop-Verknüpfung.

            Beide sind nicht signiert, weil dafür ein kostenpflichtiges
            Zertifikat nötig wäre. Windows SmartScreen zeigt deshalb beim
            ersten Start eine Warnung: auf *Weitere Informationen* klicken,
            dann auf *Trotzdem ausführen*.

            Benötigt Windows 10 oder 11, 64 Bit. Die GPU-Auslastung braucht
            Windows 10 ab Version 1709.

      - name: Publish release (zweiter Versuch)
        if: steps.decide.outputs.publish == 'true' && steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.pkg.outputs.version) }}
          name: Windows Hub ${{ steps.pkg.outputs.version }}
          # Anything not built from a tag is a build of the working branch.
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          # latest.yml belongs here too: it is the file the hub's own updater
          # reads to find out that a newer version exists. Without it the
          # release looks complete and every update check answers with a 404.
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          fail_on_unmatched_files: true
          body: |
            Fertige Windows-Dateien, gebaut auf einem Windows-Runner aus
            `${{ github.sha }}`.

            **WindowsHub-${{ steps.pkg.outputs.version }}-portable.exe**
            Startet direkt, ohne Installation. Nimm diese, wenn du es nur
            ausprobieren willst.

            **WindowsHub-${{ steps.pkg.outputs.version }}-setup.exe**
            Installer mit Startmenü- und Desktop-Verknüpfung.

            Beide sind nicht signiert, weil dafür ein kostenpflichtiges
            Zertifikat nötig wäre. Windows SmartScreen zeigt deshalb beim
            ersten Start eine Warnung: auf *Weitere Informationen* klicken,
            dann auf *Trotzdem ausführen*.

            Benötigt Windows 10 oder 11, 64 Bit. Die GPU-Auslastung braucht
            Windows 10 ab Version 1709.

