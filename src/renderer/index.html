<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file:; font-src 'self'; connect-src 'none'" />
  <title>Windows Hub</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/effects.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
</head>
<body>

  <!-- ambient effect layers ------------------------------------------- -->
  <div id="fx-layer" aria-hidden="true">
    <div class="fx-grid"></div>
    <div class="fx-horizon"></div>
    <div class="fx-vignette"></div>
    <div class="fx-sweep"></div>
    <div class="fx-scanlines"></div>
    <div class="fx-noise"></div>
  </div>

  <!-- boot sequence ---------------------------------------------------- -->
  <div id="boot">
    <div class="boot-logo glitch" data-text="WINDOWS HUB">WINDOWS HUB</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-lines"></div>
  </div>

  <!-- app shell -------------------------------------------------------- -->
  <div id="app" class="hidden">

    <header id="topbar">
      <div class="brand no-drag">
        <span class="brand-mark">//</span>
        <span class="glitch" data-text="WINDOWS HUB">WINDOWS HUB</span>
        <span class="brand-sub" id="brand-version">v0.0.0</span>
      </div>

      <div class="topbar-metrics no-drag">
        <div class="mini-metric" title="Prozessorauslastung">
          <span class="mini-label">CPU</span>
          <div class="meter" id="mini-cpu-meter"><i></i></div>
          <span class="mini-value" id="mini-cpu">--%</span>
        </div>
        <div class="mini-metric" title="Arbeitsspeicher">
          <span class="mini-label">RAM</span>
          <div class="meter" id="mini-ram-meter"><i></i></div>
          <span class="mini-value" id="mini-ram">--%</span>
        </div>
        <div class="mini-metric" id="mini-gpu-wrap" title="Grafikkarte">
          <span class="mini-label">GPU</span>
          <div class="meter" id="mini-gpu-meter"><i></i></div>
          <span class="mini-value" id="mini-gpu">--%</span>
        </div>
      </div>

      <div class="clock no-drag">
        <span id="clock-time">--:--</span>
        <span class="clock-date" id="clock-date"></span>
      </div>

      <div class="win-controls no-drag">
        <!-- Hidden until a second monitor is actually connected. -->
        <button class="icon-btn hidden" id="btn-dashboard" title="Dashboard auf dem zweiten Bildschirm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 5h18v11H3z" /><path d="M9 20h6M12 16v4" />
          </svg>
        </button>
        <button class="icon-btn" id="btn-fullscreen" title="Vollbild umschalten (F11)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
          </svg>
        </button>
        <button class="icon-btn" id="btn-minimize" title="Minimieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 12h14" /></svg>
        </button>
        <button class="icon-btn danger" id="btn-close" title="Hub beenden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
    </header>

    <nav id="rail"></nav>

    <main id="main"></main>
  </div>

  <div id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
